[project]
name = "finance-bot"
version = "2.0.0"
description = "FinanceBot — Telegram bot for financial reports (DDD · Hexagonal Architecture)"
authors = []
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.0,<4.0",
    "aiohttp>=3.0,<4.0",
    "aiosqlite>=0.20",
    "pydantic-settings>=2.0,<3.0",
    "beautifulsoup4>=4.0,<5.0",
    "APScheduler>=3.0,<4.0",
    "pyyaml>=6.0,<7.0",
]

[tool.poetry]
packages = [{ include = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = "^0.4"
black = "^24.0"
mypy = "^1.0"
pytest = "^8.0"
pytest-asyncio = "^0.23"
aioresponses = "^0.7"
types-PyYAML = "^6.0"
types-beautifulsoup4 = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN401", # dynamically typed expressions (Any)
    "S101",   # use of assert (needed in tests)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["aioresponses.*", "apscheduler.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers -v"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that hit real infrastructure (db, http)",
]
